        function render(list) {
            const container = document.getElementById('product-container');
            container.innerHTML = '';
            
            list.forEach(it => {
                const originPriceHtml = (it.originalPrice && it.originalPrice > it.displayPrice) 
                    ? `<span class="original-price">${Number(it.originalPrice).toLocaleString()}원</span>` 
                    : '';
                
                const card = document.createElement('a');
                card.href = it.affUrl || it.productUrl || '#';
                card.target = '_blank';
                card.className = 'card';
                card.innerHTML = `
                    <div class="thumb-wrap">
                        <img src="${it.thumbnailUrl || ''}" alt="${it.displayName}" loading="lazy">
                        <span class="badge">🔥 ${it.discountRate || 0}% OFF</span>
                    </div>
                    <div class="info">
                        <div class="title">${it.displayName}</div>
                        <div class="price-row">
                            ${originPriceHtml}
                            <span class="sale-price">${Number(it.displayPrice || 0).toLocaleString()}원</span>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function sortAndRender(type) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            let sorted = [...items];
            if (type === 'discount') {
                document.getElementById('btn-discount').classList.add('active');
                sorted.sort((a, b) => (b.discountRate || 0) - (a.discountRate || 0));
            } else {
                document.getElementById('btn-price').classList.add('active');
                sorted.sort((a, b) => (a.displayPrice || 999999999) - (b.displayPrice || 999999999));
            }
            render(sorted);
        }

        sortAndRender('discount');
    </script>
