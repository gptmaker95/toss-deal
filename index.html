        function updateCountdown() {
            const now = new Date();
            const utcTime = now.getTime() + (now.getTimezoneOffset() * 60 * 1000);
            const kstNow = new Date(utcTime + (9 * 60 * 60 * 1000));

            const target = new Date(kstNow);
            target.setHours(24, 0, 0, 0);

            const diff = target - kstNow;
            if (diff <= 0) {
                document.getElementById('countdown').innerText = "00:00:00";
                return;
            }

            const h = String(Math.floor((diff / (1000 * 60 * 60)) % 24)).padStart(2, '0');
            const m = String(Math.floor((diff / (1000 * 60)) % 60)).padStart(2, '0');
            const s = String(Math.floor((diff / 1000) % 60)).padStart(2, '0');

            document.getElementById('countdown').innerText = `${h}:${m}:${s}`;
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();

        function renderList(list, containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            list.forEach((it, idx) => {
                const originPriceHtml = (it.originalPrice && it.originalPrice > it.displayPrice) 
                    ? `<span class="original-price">${Number(it.originalPrice).toLocaleString()}원</span>` 
                    : '';
                const card = document.createElement('a');
                card.href = it.affUrl || it.productUrl || '#';
                card.target = '_blank';
                card.className = 'card';
                card.innerHTML = `
                    <div class="thumb-wrap">
                        <img src="${it.thumbnailUrl || ''}" alt="${it.displayName}" loading="lazy">
                        <span class="badge">🔥 ${it.discountRate || 0}%</span>
                        <span class="rank-badge">${it.rank || (idx + 1)}위</span>
                    </div>
                    <div class="info">
                        <div class="title">${it.displayName}</div>
                        <div class="price-row">
                            ${originPriceHtml}
                            <span class="sale-price">${Number(it.displayPrice || 0).toLocaleString()}원</span>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        renderList(specialList, 'special-container');
        renderList(todayList, 'today-container');

        function switchMobileTab(type) {
            const colSpecial = document.getElementById('col-special');
            const colToday = document.getElementById('col-today');
            const btnSpecial = document.getElementById('tab-btn-special');
            const btnToday = document.getElementById('tab-btn-today');

            if (type === 'special') {
                colSpecial.classList.add('active');
                colToday.classList.remove('active');
                btnSpecial.classList.add('active');
                btnToday.classList.remove('active');
            } else {
                colSpecial.classList.remove('active');
                colToday.classList.add('active');
                btnSpecial.classList.remove('active');
                btnToday.classList.add('active');
            }
        }
    </script>
