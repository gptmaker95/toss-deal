name: 2-Hour Threads Deal Poster

on:
  schedule:
    # 2시간 주기 실행 (UTC 기준 짝수 시 = 한국 시간 홀수 시)
    - cron: '0 */2 * * *'
  workflow_dispatch: # Actions 탭에서 수동 실행 버튼 활성화

permissions:
  contents: write # 인덱스 파일 변경 후 푸시할 수 있도록 쓰기 권한 부여

jobs:
  post-deal:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 라이브러리 설치
        run: pip install requests

      - name: 스레드 자동 포스팅 실행
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: python post_to_threads.py

      - name: 로테이션 인덱스 커밋 및 푸시
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add threads_rotation_idx.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update threads rotation index" && git push)